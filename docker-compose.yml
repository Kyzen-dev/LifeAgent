services:
  lifeagent:
    build:
      context: .
      args:
        INSTALL_BROWSER: "false"   # "true" + ENABLE_BROWSER=true in .env for the headless browser
    container_name: lifeagent
    # Run as the host user that owns ./data and ./workspace (setup-server.sh records it in .env).
    user: "${LIFEAGENT_UID:-1000}:${LIFEAGENT_GID:-1000}"
    restart: unless-stopped
    # tini as PID 1 reaps orphaned processes left by the Claude CLI and MCP servers.
    init: true
    env_file: .env
    # Keep Docker's log files bounded on small disks.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/data                    # SQLite DB, ~/.claude sessions, Google tokens
      - ./workspace:/app/workspace      # memory, notes, skills, subagents (editable on the host)
    ports:
      # Google OAuth callback for the one-time login; reachable only via SSH tunnel.
      # If the callback does not arrive (server bound to 127.0.0.1 inside the container),
      # temporarily replace `ports` with `network_mode: host` for the first login.
      - "127.0.0.1:8000:8000"

  # Optional LiteLLM gateway for OpenAI / Gemini / local models (see deploy/litellm/config.yaml).
  # Started only with the "gateway" profile: COMPOSE_PROFILES=gateway in .env (set by the wizard).
  # The bot reaches it at http://litellm:4000 on the compose network; it is not published.
  litellm:
    image: docker.litellm.ai/berriai/litellm:1.104.0
    profiles: ["gateway"]
    container_name: lifeagent-litellm
    restart: unless-stopped
    env_file: .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
