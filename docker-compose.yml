services:
  lifeagent:
    build:
      context: .
      args:
        INSTALL_BROWSER: "false"   # "true" + ENABLE_BROWSER=true in .env for the headless browser
    container_name: lifeagent
    # Run as the host user that owns ./data and ./workspace (setup-server.sh records it in .env).
    user: "${LIFEAGENT_UID:-1000}:${LIFEAGENT_GID:-1000}"
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data                    # SQLite DB, ~/.claude sessions, Google tokens
      - ./workspace:/app/workspace      # memory, notes, skills, subagents (editable on the host)
    ports:
      # Google OAuth callback for the one-time login; reachable only via SSH tunnel.
      # If the callback does not arrive (server bound to 127.0.0.1 inside the container),
      # temporarily replace `ports` with `network_mode: host` for the first login.
      - "127.0.0.1:8000:8000"
