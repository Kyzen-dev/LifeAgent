name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check --select E,F,W,B --ignore E501 lifeagent tests deploy
      - run: python -m pytest -q
      - run: bash -n deploy/setup-server.sh

  gateway:
    # The optional LiteLLM gateway: the pinned image starts with our config and routes
    # Anthropic Messages API calls to the provider (here it must fail auth with a fake key).
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the gateway
        run: |
          image=$(awk '/image: .*litellm/ {print $2}' docker-compose.yml)
          echo "image=$image"
          docker run -d --name gw -p 4000:4000 \
            -e LITELLM_MASTER_KEY=sk-ci-test -e OPENAI_API_KEY=sk-ci-invalid -e GEMINI_API_KEY=ci-invalid \
            -v "$PWD/deploy/litellm/config.yaml:/app/config.yaml:ro" \
            "$image" --config /app/config.yaml --port 4000
          for i in $(seq 90); do curl -sf localhost:4000/health/liveliness && break; sleep 2; done
          curl -sf localhost:4000/health/liveliness
      - name: Model names are served and requests reach the provider
        run: |
          curl -sf -H "Authorization: Bearer sk-ci-test" localhost:4000/v1/models | tee models.json
          for m in gpt-6.1-sol gpt-6-luna gemini-3.1-pro-preview gemini-3.8-flash; do grep -q "\"$m\"" models.json; done
          code=$(curl -s -o out.json -w '%{http_code}' localhost:4000/v1/messages \
            -H "Authorization: Bearer sk-ci-test" -H 'content-type: application/json' \
            -d '{"model":"gpt-6-luna","max_tokens":16,"messages":[{"role":"user","content":"hi"}]}')
          echo "HTTP $code"; cat out.json; echo
          test "$code" != 200 && grep -qiE 'auth|api.?key|incorrect' out.json
          # the master key is enforced
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/v1/models)" = 401
      - if: failure()
        run: docker logs gw 2>&1 | tail -120

  docker:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64   # Oracle Cloud Always Free (Ampere)
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: lifeagent:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test inside the image (as an arbitrary non-root user)
        run: |
          # Same layout as production: data and workspace are host folders owned by the run user.
          mkdir -p ci-data && cp -r workspace ci-workspace && sudo chown -R 1234:1234 ci-data ci-workspace
          docker run --rm --user 1234:1234 \
            -v "$PWD/deploy:/smoke:ro" -v "$PWD/ci-data:/data" -v "$PWD/ci-workspace:/app/workspace" \
            lifeagent:ci python /smoke/container_smoke.py
